[package]
name = "grain"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
autobins = false
default-run = "grain"
description = "Audio-reactive creative coding in the terminal"
license = "MIT"
repository = "https://github.com/delaudio/grain"
readme = "README.md"
keywords = ["creative-coding", "terminal", "audio", "generative-art"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "grain"
path = "src/main.rs"

[[bin]]
name = "gen_fixture"
path = "src/bin/gen_fixture.rs"
required-features = ["internal-test-fixture"]

[features]
default = []
internal-test-fixture = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", features = ["mp3", "wav"] }
rodio = "0.20"
rquickjs = { version = "0.12.2", default-features = false }
tiny-skia = "0.12.0"
libc = "0.2"
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes"] }
