[package]
name = "grain"
version = "0.1.0"
edition = "2024"
default-run = "grain"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", features = ["mp3", "wav"] }
rodio = "0.20"
